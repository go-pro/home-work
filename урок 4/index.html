<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="form">
    <fieldset class="fieldset1">
        <p class="zagolovok">Ваши личные данные</p>
        <label class="label">
          <p>Ваше имя</p>
          <input class="input" type="text" name="name" placeholder="Имя" required>
        </label>
        <label class="label">
          <p>Ваш возвраст</p>
          <input class="input" type="number" name="age" placeholder="Возвраст" required>
        </label>
        <label class="label">
          <p>Ваш номер телефона</p>
          <input class="input" type="tel" name=number" placeholder="Номер телефона" required>
        </label>
        <label class="label">
          <p>Ваша почта</p>
          <input class="input" type="email" name="email" placeholder="Почта" required>
        </label>


    </fieldset>
    <fieldset class="fieldset2">
      <label class="label">
        <p>Сообщение</p>
      <textarea class="textarea" type="text" placeholder="Ваше сообщение" required></textarea>
    </label>
    <label class="label" >
      <input class="input" type="checkbox" required>
      Я принимаю условия
    </label>

    <button class="button">отправить</button>
    </fieldset>
    
  </form>
  
</body>
</html>
